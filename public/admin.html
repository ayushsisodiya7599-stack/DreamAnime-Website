<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>DreamAnime Admin</title>

    <meta
        name="description"
        content="DreamAnime Admin Panel"
    >

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
        }

        body {
            font-family:
                Arial,
                Helvetica,
                sans-serif;

            background: #050505;
            color: white;

            min-height: 100vh;

            overflow-x: hidden;
        }


        /* =========================================
           BACKGROUND VIDEO
        ========================================= */

        .video-background {
            position: fixed;

            inset: 0;

            width: 100%;
            height: 100%;

            z-index: -10;

            overflow: hidden;

            background: #050505;
        }

        .video-background video {
            width: 100%;
            height: 100%;

            object-fit: cover;

            filter:
                brightness(0.42)
                saturate(1.2);
        }

        .video-overlay {
            position: absolute;

            inset: 0;

            background:
                linear-gradient(
                    135deg,
                    rgba(0, 0, 0, 0.82),
                    rgba(20, 0, 8, 0.48),
                    rgba(0, 0, 0, 0.88)
                );
        }

        .red-glow {
            position: absolute;

            width: 650px;
            height: 650px;

            left: 50%;
            top: 50%;

            transform:
                translate(-50%, -50%);

            background:
                radial-gradient(
                    circle,
                    rgba(255, 23, 68, 0.18),
                    transparent 68%
                );

            filter: blur(25px);

            pointer-events: none;
        }


        /* =========================================
           HEADER
        ========================================= */

        header {
            position: fixed;

            top: 0;
            left: 0;

            width: 100%;
            height: 75px;

            padding: 0 6%;

            display: flex;

            align-items: center;

            justify-content: space-between;

            background:
                rgba(4, 4, 4, 0.62);

            backdrop-filter:
                blur(15px);

            -webkit-backdrop-filter:
                blur(15px);

            border-bottom:
                1px solid
                rgba(255, 255, 255, 0.08);

            z-index: 100;
        }

        .logo {
            font-size: 27px;

            font-weight: 900;

            letter-spacing: -1px;

            text-shadow:
                0 0 20px
                rgba(255, 23, 68, 0.25);
        }

        .logo span {
            color: #ff1744;
        }

        .header-title {
            color: #999;

            font-size: 12px;

            letter-spacing: 1px;

            text-transform: uppercase;
        }


        /* =========================================
           SOUND BUTTON
        ========================================= */

        .sound-btn {
            position: fixed;

            right: 24px;
            bottom: 24px;

            width: 48px;
            height: 48px;

            border-radius: 50%;

            border:
                1px solid
                rgba(255, 255, 255, 0.18);

            background:
                rgba(0, 0, 0, 0.65);

            color: white;

            font-size: 19px;

            cursor: pointer;

            backdrop-filter:
                blur(10px);

            z-index: 300;

            transition: 0.25s ease;
        }

        .sound-btn:hover {
            transform: scale(1.08);

            background: #ff1744;

            border-color: #ff1744;

            box-shadow:
                0 0 25px
                rgba(255, 23, 68, 0.4);
        }


        /* =========================================
           MAIN
        ========================================= */

        .page {
            min-height: 100vh;

            display: flex;

            justify-content: center;

            align-items: center;

            padding:
                110px 20px 60px;
        }


        /* =========================================
           ADMIN CONTAINER
        ========================================= */

        .container {
            width: 100%;

            max-width: 580px;

            padding: 38px;

            background:
                rgba(8, 8, 8, 0.78);

            border:
                1px solid
                rgba(255, 255, 255, 0.10);

            border-radius: 22px;

            backdrop-filter:
                blur(20px);

            -webkit-backdrop-filter:
                blur(20px);

            box-shadow:
                0 30px 100px
                rgba(0, 0, 0, 0.65);

            animation:
                containerEnter
                0.8s ease forwards;
        }

        @keyframes containerEnter {

            from {
                opacity: 0;

                transform:
                    translateY(30px)
                    scale(0.97);
            }

            to {
                opacity: 1;

                transform:
                    translateY(0)
                    scale(1);
            }

        }


        /* =========================================
           LOGIN
        ========================================= */

        .panel-icon {
            width: 65px;
            height: 65px;

            display: flex;

            align-items: center;
            justify-content: center;

            border-radius: 17px;

            background:
                rgba(255, 23, 68, 0.10);

            border:
                1px solid
                rgba(255, 23, 68, 0.25);

            font-size: 30px;

            margin-bottom: 20px;

            box-shadow:
                0 0 30px
                rgba(255, 23, 68, 0.10);
        }

        h1 {
            font-size: 31px;

            margin-bottom: 9px;

            font-weight: 900;
        }

        h1 span {
            color: #ff1744;
        }

        .subtitle {
            color: #999;

            line-height: 1.6;

            font-size: 14px;

            margin-bottom: 27px;
        }


        /* =========================================
           INPUTS
        ========================================= */

        .input-group {
            position: relative;

            margin-bottom: 15px;
        }

        .input-icon {
            position: absolute;

            left: 15px;
            top: 50%;

            transform:
                translateY(-50%);

            font-size: 16px;

            opacity: 0.65;

            pointer-events: none;
        }

        input[type="text"],
        input[type="password"] {
            width: 100%;

            height: 52px;

            padding:
                0 15px 0 45px;

            background:
                rgba(255, 255, 255, 0.045);

            color: white;

            border:
                1px solid
                rgba(255, 255, 255, 0.10);

            border-radius: 11px;

            outline: none;

            font-size: 14px;

            transition: 0.25s ease;
        }

        input:focus {
            border-color:
                rgba(255, 23, 68, 0.65);

            background:
                rgba(255, 23, 68, 0.045);

            box-shadow:
                0 0 0 3px
                rgba(255, 23, 68, 0.08);
        }


        /* =========================================
           BUTTON
        ========================================= */

        button.action-btn {
            width: 100%;

            height: 52px;

            border: none;

            border-radius: 11px;

            background: #ff1744;

            color: white;

            font-size: 15px;

            font-weight: 800;

            cursor: pointer;

            transition: 0.25s ease;

            box-shadow:
                0 10px 30px
                rgba(255, 23, 68, 0.20);
        }

        button.action-btn:hover {
            transform: translateY(-2px);

            background: #ff3158;

            box-shadow:
                0 15px 38px
                rgba(255, 23, 68, 0.32);
        }

        button.action-btn:active {
            transform: translateY(0);
        }

        button.action-btn:disabled {
            opacity: 0.65;

            cursor: not-allowed;

            transform: none;
        }


        /* =========================================
           UPLOAD BOX
        ========================================= */

        #loginBox,
        #uploadBox {
            display: none;
        }

        #loginBox {
            display: block;
        }


        .upload-header {
            display: flex;

            align-items: center;

            gap: 15px;

            margin-bottom: 25px;
        }

        .upload-header .panel-icon {
            margin: 0;

            flex-shrink: 0;
        }

        .upload-header h1 {
            margin: 0;

            font-size: 25px;
        }


        /* =========================================
           LATEST APK CARD
        ========================================= */

        .latest-card {
            display: none;

            margin-bottom: 23px;

            padding: 19px;

            border-radius: 14px;

            background:
                linear-gradient(
                    135deg,
                    rgba(255, 23, 68, 0.10),
                    rgba(255, 255, 255, 0.035)
                );

            border:
                1px solid
                rgba(255, 23, 68, 0.18);
        }

        .latest-label {
            color: #888;

            font-size: 10px;

            text-transform: uppercase;

            letter-spacing: 1.2px;

            margin-bottom: 8px;
        }

        .latest-version {
            font-size: 22px;

            font-weight: 900;

            margin-bottom: 7px;
        }

        .latest-version span {
            color: #ff1744;
        }

        .latest-file {
            color: #999;

            font-size: 12px;

            word-break: break-all;

            line-height: 1.5;
        }


        /* =========================================
           FILE UPLOAD
        ========================================= */

        .file-box {
            position: relative;

            margin-bottom: 17px;
        }

        .file-label {
            display: flex;

            flex-direction: column;

            align-items: center;

            justify-content: center;

            min-height: 145px;

            padding: 25px 15px;

            border:
                1px dashed
                rgba(255, 23, 68, 0.35);

            border-radius: 14px;

            background:
                rgba(255, 23, 68, 0.035);

            cursor: pointer;

            transition: 0.25s ease;

            text-align: center;
        }

        .file-label:hover {
            border-color: #ff1744;

            background:
                rgba(255, 23, 68, 0.07);
        }

        .file-icon {
            font-size: 34px;

            margin-bottom: 9px;
        }

        .file-main {
            font-size: 14px;

            font-weight: 700;

            margin-bottom: 5px;
        }

        .file-sub {
            color: #777;

            font-size: 11px;
        }

        #apkFile {
            position: absolute;

            width: 1px;
            height: 1px;

            opacity: 0;

            pointer-events: none;
        }


        /* =========================================
           SELECTED FILE
        ========================================= */

        .selected-file {
            display: none;

            margin-top: 10px;

            padding: 11px 13px;

            border-radius: 9px;

            background:
                rgba(124, 255, 155, 0.06);

            border:
                1px solid
                rgba(124, 255, 155, 0.12);

            color: #9dffb2;

            font-size: 12px;

            word-break: break-all;
        }


        /* =========================================
           STATUS
        ========================================= */

        #status {
            display: none;

            margin-top: 18px;

            padding: 13px 15px;

            border-radius: 10px;

            font-size: 13px;

            line-height: 1.5;

            animation:
                statusEnter
                0.25s ease;
        }

        @keyframes statusEnter {

            from {
                opacity: 0;
                transform: translateY(5px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }

        }


        /* =========================================
           LOGOUT
        ========================================= */

        .logout {
            margin-top: 12px;

            width: 100%;

            height: 48px;

            border:
                1px solid
                rgba(255, 255, 255, 0.09);

            border-radius: 10px;

            background:
                rgba(255, 255, 255, 0.045);

            color: #aaa;

            font-size: 13px;

            font-weight: 700;

            cursor: pointer;

            transition: 0.25s ease;
        }

        .logout:hover {
            background:
                rgba(255, 255, 255, 0.08);

            color: white;
        }


        /* =========================================
           BACK LINK
        ========================================= */

        .back {
            display: block;

            margin-top: 22px;

            color: #777;

            text-decoration: none;

            text-align: center;

            font-size: 13px;

            transition: 0.2s ease;
        }

        .back:hover {
            color: white;
        }


        /* =========================================
           FOOTER TEXT
        ========================================= */

        .security-note {
            margin-top: 18px;

            text-align: center;

            color: #555;

            font-size: 10px;

            line-height: 1.5;
        }


        /* =========================================
           MOBILE
        ========================================= */

        @media (max-width: 650px) {

            header {
                height: 67px;

                padding:
                    0 20px;
            }

            .logo {
                font-size: 22px;
            }

            .header-title {
                display: none;
            }

            .page {
                padding:
                    95px 15px 45px;
            }

            .container {
                padding:
                    27px 19px;

                border-radius: 18px;
            }

            h1 {
                font-size: 27px;
            }

            .upload-header h1 {
                font-size: 22px;
            }

            .sound-btn {
                right: 17px;
                bottom: 17px;
            }

        }

    </style>

</head>


<body>


<!-- =========================================
     ADMIN WALLPAPER
========================================= -->

<div class="video-background">

    <video
        id="wallpaper"
        autoplay
        loop
        muted
        playsinline
        preload="auto"
    >

        <source
            src="/videos/admin_wallpaper.mp4"
            type="video/mp4"
        >

        Your browser does not support video.

    </video>


    <div class="video-overlay"></div>

    <div class="red-glow"></div>

</div>


<!-- =========================================
     HEADER
========================================= -->

<header>

    <div class="logo">
        Dream<span>Anime</span>
    </div>

    <div class="header-title">
        Administration Panel
    </div>

</header>


<!-- =========================================
     SOUND
========================================= -->

<button
    class="sound-btn"
    id="soundButton"
    onclick="toggleSound()"
    title="Turn sound on/off"
>
    🔇
</button>


<!-- =========================================
     PAGE
========================================= -->

<main class="page">


    <div class="container">


        <!-- =====================================
             LOGIN BOX
        ====================================== -->

        <div id="loginBox">

            <div class="panel-icon">
                🔐
            </div>


            <h1>
                Admin <span>Login</span>
            </h1>


            <p class="subtitle">

                Login to manage the latest
                DreamAnime Android application.

            </p>


            <!-- USERNAME -->

            <div class="input-group">

                <span class="input-icon">
                    👤
                </span>

                <input
                    type="text"
                    id="username"
                    placeholder="Admin username"
                    autocomplete="username"
                >

            </div>


            <!-- PASSWORD -->

            <div class="input-group">

                <span class="input-icon">
                    🔑
                </span>

                <input
                    type="password"
                    id="password"
                    placeholder="Admin password"
                    autocomplete="current-password"
                >

            </div>


            <button
                class="action-btn"
                id="loginButton"
                onclick="login()"
            >
                🔓 Login to Dashboard
            </button>


            <div class="security-note">
                DreamAnime Admin • Secure session
            </div>

        </div>


        <!-- =====================================
             UPLOAD BOX
        ====================================== -->

        <div id="uploadBox">


            <div class="upload-header">

                <div class="panel-icon">
                    📱
                </div>

                <div>

                    <h1>
                        Upload <span>APK</span>
                    </h1>

                    <p class="subtitle">
                        Publish a new DreamAnime version.
                    </p>

                </div>

            </div>


            <!-- CURRENT VERSION -->

            <div
                class="latest-card"
                id="latestCard"
            >

                <div class="latest-label">
                    Current Latest Release
                </div>

                <div
                    class="latest-version"
                    id="latestVersion"
                >
                    DreamAnime
                </div>

                <div
                    class="latest-file"
                    id="latestFile"
                >
                    Loading...
                </div>

            </div>


            <!-- FILE -->

            <div class="file-box">

                <label
                    class="file-label"
                    for="apkFile"
                >

                    <div class="file-icon">
                        📦
                    </div>

                    <div class="file-main">
                        Choose DreamAnime APK
                    </div>

                    <div class="file-sub">
                        APK files only • Maximum 500 MB
                    </div>

                </label>


                <input
                    type="file"
                    id="apkFile"
                    accept=".apk"
                >


                <div
                    class="selected-file"
                    id="selectedFile"
                >
                </div>

            </div>


            <!-- UPLOAD -->

            <button
                class="action-btn"
                id="uploadButton"
                onclick="uploadAPK()"
            >
                🚀 Upload New APK
            </button>


            <!-- LOGOUT -->

            <button
                class="logout"
                onclick="logout()"
            >
                Logout
            </button>


        </div>


        <!-- =====================================
             STATUS
        ====================================== -->

        <div id="status"></div>


        <!-- BACK -->

        <a
            class="back"
            href="/"
        >
            ← Back to DreamAnime
        </a>


    </div>

</main>


<script>


    /* =========================================
       WALLPAPER
    ========================================= */

    const wallpaper =
        document.getElementById(
            "wallpaper"
        );


    const soundButton =
        document.getElementById(
            "soundButton"
        );


    /* =========================================
       SOUND
    ========================================= */

    function toggleSound() {

        if (!wallpaper) {
            return;
        }


        if (wallpaper.muted) {

            wallpaper.muted = false;

            soundButton.textContent = "🔊";


            wallpaper.play().catch(() => {

                wallpaper.muted = true;

                soundButton.textContent = "🔇";

            });

        } else {

            wallpaper.muted = true;

            soundButton.textContent = "🔇";

        }

    }


    /* =========================================
       START WALLPAPER
    ========================================= */

    window.addEventListener(
        "load",
        function() {

            wallpaper.play().catch(() => {

                console.log(
                    "Wallpaper autoplay waiting."
                );

            });

        }
    );


    /* =========================================
       STATUS
    ========================================= */

    function showStatus(
        message,
        success
    ) {

        const status =
            document.getElementById(
                "status"
            );


        status.style.display = "block";

        status.textContent = message;


        if (success) {

            status.style.background =
                "rgba(30, 110, 55, 0.20)";

            status.style.color =
                "#7cff9b";

            status.style.border =
                "1px solid rgba(124, 255, 155, 0.15)";

        } else {

            status.style.background =
                "rgba(110, 20, 20, 0.25)";

            status.style.color =
                "#ff8585";

            status.style.border =
                "1px solid rgba(255, 100, 100, 0.15)";

        }

    }


    /* =========================================
       LOGIN
    ========================================= */

    async function login() {

        const username =
            document.getElementById(
                "username"
            ).value.trim();


        const password =
            document.getElementById(
                "password"
            ).value;


        if (!username || !password) {

            showStatus(
                "Username aur password enter karo.",
                false
            );

            return;
        }


        const loginButton =
            document.getElementById(
                "loginButton"
            );


        loginButton.disabled = true;

        loginButton.textContent =
            "⏳ Logging in...";


        try {

            const response =
                await fetch(
                    "/api/admin-login",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify({
                                username:
                                    username,

                                password:
                                    password
                            })
                    }
                );


            const data =
                await response.json();


            if (data.success) {

                sessionStorage.setItem(
                    "dreamanime_admin",
                    "true"
                );


                document.getElementById(
                    "loginBox"
                ).style.display = "none";


                document.getElementById(
                    "uploadBox"
                ).style.display = "block";


                document.getElementById(
                    "status"
                ).style.display = "none";


                await loadLatestAPK();


            } else {

                showStatus(
                    "❌ Invalid username or password.",
                    false
                );

            }


        } catch (error) {

            console.error(
                "Login error:",
                error
            );


            showStatus(
                "❌ Server se connection nahi ho raha.",
                false
            );

        }


        loginButton.disabled = false;

        loginButton.textContent =
            "🔓 Login to Dashboard";

    }


    /* =========================================
       FILE SELECT
    ========================================= */

    document
        .getElementById("apkFile")
        .addEventListener(
            "change",
            function() {

                const file =
                    this.files[0];


                const selectedFile =
                    document.getElementById(
                        "selectedFile"
                    );


                if (!file) {

                    selectedFile.style.display =
                        "none";

                    return;

                }


                if (
                    !file.name
                        .toLowerCase()
                        .endsWith(".apk")
                ) {

                    selectedFile.style.display =
                        "block";

                    selectedFile.style.color =
                        "#ff8585";

                    selectedFile.textContent =
                        "❌ Only APK files allowed hain.";

                    this.value = "";

                    return;

                }


                const sizeMB =
                    file.size /
                    (1024 * 1024);


                if (sizeMB > 500) {

                    selectedFile.style.display =
                        "block";

                    selectedFile.style.color =
                        "#ff8585";

                    selectedFile.textContent =
                        "❌ APK 500 MB se zyada hai.";

                    this.value = "";

                    return;

                }


                selectedFile.style.display =
                    "block";

                selectedFile.style.color =
                    "#9dffb2";

                selectedFile.textContent =
                    `✅ ${file.name} • ${sizeMB.toFixed(1)} MB`;

            }
        );


    /* =========================================
       UPLOAD APK
    ========================================= */

    async function uploadAPK() {


        if (
            sessionStorage.getItem(
                "dreamanime_admin"
            ) !== "true"
        ) {

            showStatus(
                "Please login first.",
                false
            );

            return;

        }


        const fileInput =
            document.getElementById(
                "apkFile"
            );


        if (!fileInput.files.length) {

            showStatus(
                "APK file select karo.",
                false
            );

            return;

        }


        const file =
            fileInput.files[0];


        if (
            !file.name
                .toLowerCase()
                .endsWith(".apk")
        ) {

            showStatus(
                "❌ Only APK files allowed hain.",
                false
            );

            return;

        }


        if (
            file.size >
            500 * 1024 * 1024
        ) {

            showStatus(
                "❌ APK 500 MB se zyada hai.",
                false
            );

            return;

        }


        const formData =
            new FormData();


        formData.append(
            "apk",
            file
        );


        const uploadButton =
            document.getElementById(
                "uploadButton"
            );


        uploadButton.disabled = true;

        uploadButton.textContent =
            "⏳ Uploading APK...";


        showStatus(
            "⏳ APK upload ho rahi hai... thoda wait karo.",
            true
        );


        try {

            const response =
                await fetch(
                    "/api/upload-apk",
                    {
                        method: "POST",

                        body: formData
                    }
                );


            const data =
                await response.json();


            if (data.success) {


                showStatus(
                    `✅ DreamAnime Version ${data.version} successfully uploaded!`,
                    true
                );


                fileInput.value = "";


                document.getElementById(
                    "selectedFile"
                ).style.display = "none";


                await loadLatestAPK();


            } else {

                showStatus(
                    "❌ " +
                    (
                        data.message ||
                        "Upload failed."
                    ),
                    false
                );

            }


        } catch (error) {

            console.error(
                "Upload error:",
                error
            );


            showStatus(
                "❌ Upload failed. Server connection check karo.",
                false
            );

        }


        uploadButton.disabled = false;

        uploadButton.textContent =
            "🚀 Upload New APK";

    }


    /* =========================================
       LATEST APK
    ========================================= */

    async function loadLatestAPK() {


        const latestCard =
            document.getElementById(
                "latestCard"
            );


        const latestVersion =
            document.getElementById(
                "latestVersion"
            );


        const latestFile =
            document.getElementById(
                "latestFile"
            );


        try {

            const response =
                await fetch(
                    "/api/admin/latest-apk",
                    {
                        cache: "no-store"
                    }
                );


            const data =
                await response.json();


            if (
                data.success &&
                data.available
            ) {


                latestCard.style.display =
                    "block";


                latestVersion.innerHTML =
                    `DreamAnime <span>Vision ${escapeHTML(data.version)}</span>`;


                latestFile.textContent =
                    data.filename ||
                    data.originalName ||
                    "Latest APK";


            } else {


                latestCard.style.display =
                    "block";


                latestVersion.textContent =
                    "No APK uploaded yet";


                latestVersion.style.color =
                    "#aaa";


                latestFile.textContent =
                    "Upload your first DreamAnime APK.";

            }


        } catch (error) {

            console.error(
                "Latest APK error:",
                error
            );


            latestCard.style.display =
                "block";


            latestVersion.textContent =
                "Unable to check APK";


            latestVersion.style.color =
                "#ff8585";


            latestFile.textContent =
                "Server connection check karo.";

        }

    }


    /* =========================================
       LOGOUT
    ========================================= */

    function logout() {


        sessionStorage.removeItem(
            "dreamanime_admin"
        );


        document.getElementById(
            "uploadBox"
        ).style.display = "none";


        document.getElementById(
            "loginBox"
        ).style.display = "block";


        document.getElementById(
            "username"
        ).value = "";


        document.getElementById(
            "password"
        ).value = "";


        document.getElementById(
            "status"
        ).style.display = "none";


        document.getElementById(
            "latestCard"
        ).style.display = "none";

    }


    /* =========================================
       SECURITY
    ========================================= */

    function escapeHTML(value) {

        return String(value)

            .replace(
                /&/g,
                "&amp;"
            )

            .replace(
                /</g,
                "&lt;"
            )

            .replace(
                />/g,
                "&gt;"
            )

            .replace(
                /"/g,
                "&quot;"
            )

            .replace(
                /'/g,
                "&#039;"
            );

    }


    /* =========================================
       ENTER KEY LOGIN
    ========================================= */

    document
        .getElementById("password")
        .addEventListener(
            "keydown",
            function(event) {

                if (
                    event.key === "Enter"
                ) {

                    login();

                }

            }
        );


    /* =========================================
       CHECK EXISTING SESSION
    ========================================= */

    window.addEventListener(
        "load",
        async function() {


            if (
                sessionStorage.getItem(
                    "dreamanime_admin"
                ) === "true"
            ) {


                document.getElementById(
                    "loginBox"
                ).style.display = "none";


                document.getElementById(
                    "uploadBox"
                ).style.display = "block";


                await loadLatestAPK();

            }

        }
    );

</script>


</body>

</html>
